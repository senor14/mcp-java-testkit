name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B test
      - name: Test Gradle packaged-JAR example
        if: runner.os != 'Windows'
        working-directory: examples/gradle-packaged-jar
        run: ./gradlew --no-daemon test
      - name: Test Gradle packaged-JAR example on Windows
        if: runner.os == 'Windows'
        working-directory: examples/gradle-packaged-jar
        run: .\gradlew.bat --no-daemon test
